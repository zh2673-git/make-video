<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{SCENE_ID}} · compare-stage</title>
<!--
  动效语法：y2 拼贴的「对比」分支 + 阿杜错峰主次（P8-T1）
  对比旧 comparison.html 的差异：那只是「两个框淡入」——本模板的戏在胜负翻转：
    - 中线先划下来（这是「分界」的动作，不是装饰）；
    - 两栏错峰入场（data-rank 分级，输的一侧压后且 opacity 低）；
    - 标点镜才 punch（V-MOT-013 预算），推赢的一侧；
    - 母题循环分两层：赢侧呼吸略快（张力），中线 shimmer。
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  [data-scene-id] { position: relative; width: 100%; height: 100%; }
  body { font-family: {{FONT}}; background: {{NEUTRAL_4}}; color: {{NEUTRAL_0}}; }

  .stage {
    position: relative; width: 100%; height: 100%; box-sizing: border-box;
    padding: 7% 8%;
    background: linear-gradient(176deg, {{NEUTRAL_4}} 0%, {{NEUTRAL_3}} 100%);
  }

  /* 环境光斑：最底层的呼吸母题 */
  .halo {
    position: absolute; inset: -10%;
    background: radial-gradient(ellipse at 68% 24%, {{ACCENT}}4d 0%, transparent 56%);
    pointer-events: none;
  }

  /* 中线：胜负分界，先「画」下来再让两栏就位 */
  .divider {
    position: absolute; left: 50%; top: 16%; bottom: 12%; width: 3px;
    margin-left: -1.5px; border-radius: 2px;
    background: linear-gradient({{PRIMARY}}, {{PRIMARY}}22);
    transform-origin: 50% 0; z-index: 2;
  }

  .kicker {
    position: relative; z-index: 4; font-size: {{BODY_SIZE}}px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase; color: {{NEUTRAL_2}};
    margin-bottom: 1.6vmin;
  }
  .subject {
    position: relative; z-index: 4;
    font-size: {{TITLE_SIZE}}px; font-weight: 800; line-height: 1.16;
    letter-spacing: -0.02em; color: {{NEUTRAL_0}}; max-width: 88%; margin: 0 0 3vmin;
  }

  .duel { position: relative; z-index: 3; display: flex; gap: 6%; align-items: stretch; margin-top: 2.2vmin; }
  .side {
    flex: 1; position: relative; border-radius: 12px; padding: 4.4% 3.6%;
    background: {{NEUTRAL_4}};
    box-shadow: 0 16px 38px rgba(38,30,18,0.18), 0 0 0 1px {{NEUTRAL_3}};
  }
  .side.winner { border: 2px solid {{ACCENT}}; }
  .side .tag {
    font-size: calc({{BODY_SIZE}}px * 0.8); font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: {{NEUTRAL_2}}; margin-bottom: 1.2vmin;
  }
  .side.winner .tag { color: {{PRIMARY}}; }
  .side .num {
    font-size: calc({{TITLE_SIZE}}px * 1.25); font-weight: 800; line-height: 1.05;
    color: {{NEUTRAL_0}};
  }
  .side.winner .num { color: {{PRIMARY}}; }
  .side .note { margin-top: 1.6vmin; font-size: calc({{BODY_SIZE}}px * 0.92); line-height: 1.5; color: {{NEUTRAL_1}}; }
  .side.loser { opacity: 0.72; }
  .side .bar {
    display: block; height: 0.4em; margin-top: 1.8vmin; border-radius: 2px;
    background: {{ACCENT}}; transform-origin: 0 50%; opacity: 0.6;
  }
  .side.loser .bar { background: {{NEUTRAL_2}}; }

  .hint {
    position: relative; z-index: 4; margin-top: 3vmin;
    font-size: {{BODY_SIZE}}px; line-height: 1.6; color: {{NEUTRAL_2}}; opacity: 0.7;
    max-width: 70%;
  }

  .letterbox { position: absolute; inset: 0; pointer-events: none; display: {{LETTERBOX}};
    background: linear-gradient(to bottom, #000 0 8%, transparent 8% 92%, #000 92% 100%); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: {{GRAIN}};
    background-image: repeating-radial-gradient(circle at 62% 55%, rgba(80,64,40,0.10) 0 0.4px, transparent 0.5px 1.8px);
    background-size: 5px 5px; mix-blend-mode: multiply; }
  .vignette { position: absolute; inset: 0; pointer-events: none; opacity: {{VIGNETTE}};
    background: radial-gradient(ellipse at center, transparent 56%, rgba(58,44,24,0.40) 130%); }
</style>
</head>
<body data-scene-id="{{SCENE_ID}}">
<div data-scene-id="{{SCENE_ID}}" data-beats="5" data-accent="{{ACCENT_FLAG}}">
  <div class="stage">
    <div class="halo" data-motif></div>
    <div class="divider" data-divider></div>
    <div class="kicker" data-rank="tertiary">{{KICKER}}</div>
    <div class="subject" data-rank="primary">{{TITLE}}</div>
    <div class="duel">
      <div class="side loser" data-rank="secondary">
        <div class="tag">{{LEFT_TAG}}</div>
        <div class="num">{{LEFT_NUM}}</div>
        <div class="note">{{LEFT_NOTE}}</div>
        <span class="bar" data-bar></span>
      </div>
      <div class="side winner" data-rank="secondary">
        <div class="tag">{{RIGHT_TAG}}</div>
        <div class="num">{{RIGHT_NUM}}</div>
        <div class="note">{{RIGHT_NOTE}}</div>
        <span class="bar" data-bar></span>
      </div>
    </div>
    <div class="hint" data-rank="tertiary">{{SUB_LINE}}</div>
  </div>
  <div class="letterbox"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>
<script src="../motion/gsap.min.js"></script>
<script src="../motion/motion-lib.js"></script>
<script>
(function () {
  function boot() {
    MV.use('scene-{{SCENE_ID}}');
    if (!MV.timeline()) return;
    var accentEl = document.querySelector('[data-accent]');
    var accent = accentEl ? accentEl.getAttribute('data-accent') === '1' : true;

    // 环境光斑（放在最底层的母题，先把「画是活的」立起来）
    MV.motifLoop('.halo', { kind: 'breathe', amp: 0.9, duration: 1800, span: 16 });

    // ① 错峰入场：主语先落、两栏压后、hint 最后（data-rank 分级）
    MV.staggeredIn('.subject, .side, .kicker, .hint', { delay: 40, secondary: 180, tertiary: 320 });

    // ② 中线划下来：分界是「画上去」的（y2 红线的动作语言）
    MV.maskReveal('.divider', { dir: 'down', duration: 480, delay: 300 });

    // ③ 数字滚动落定：输的一侧先落，赢的一侧踩在口播重读上（错峰 240ms）
    MV.counter('.side .num', { delay: 480, stagger: 240 });

    // ④ 荧光条：赢侧满画，输侧只画一半（高亮也是叙事）
    MV.highlight('.side .bar', { delay: 720, stagger: 160 });

    // ⑤ 重音标点：推赢的一侧（不是整屏），且只在标点镜（V-MOT-013 预算）
    if (accent) MV.punch('.side.winner', { delay: {{PUNCH_AT}}, amp: 1.12 });

    // ⑥ 张力层：中线微光扫过（与主体分离的第二母题）
    MV.motifLoop('.divider', { kind: 'shimmer', amp: 0.5, duration: 2000, span: 16 });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>

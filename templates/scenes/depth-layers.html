<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: {{FONT}}; background: linear-gradient(180deg, {{NEUTRAL_0}} 0%, {{PRIMARY}}55 58%, {{NEUTRAL_0}} 100%); }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; perspective: 1100px; transform-style: preserve-3d; }
  /* 三层纵深：远层冷、近层实，靠 data-depth 让景深原语各自给位移，不做整体缩放糊弄 */
  .layer { position: absolute; transform-style: preserve-3d; }
  .far { inset: 0; background: radial-gradient(ellipse at 50% 42%, {{ACCENT}}55 0%, transparent 60%); }
  .mid { left: 8%; right: 8%; top: 18%; height: 56%; border-radius: 18px;
         background: linear-gradient(150deg, {{PRIMARY}}44, transparent 70%);
         border: 1px solid {{NEUTRAL_2}}55; opacity: 0.62; }
  .near { left: -6%; right: -6%; bottom: -22%; height: 46%;
          background: linear-gradient(0deg, {{NEUTRAL_0}} 20%, transparent 100%); opacity: 0.7; }
  .ridge { position: absolute; left: 0; right: 0; bottom: 0; height: 26%;
           background: linear-gradient(0deg, {{NEUTRAL_1}}, transparent); opacity: 0.55; }
  .subject { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); color: {{NEUTRAL_4}};
             font-size: {{TITLE_SIZE}}px; font-weight: 700; text-align: center; text-shadow: 0 3px 30px rgba(0,0,0,0.55); }
  .grain, .vignette, .letterbox { position: absolute; inset: 0; pointer-events: none; }
  .letterbox { display: {{LETTERBOX}}; background: linear-gradient(to bottom, #000 0 8%, transparent 8% 92%, #000 92% 100%); }
</style>
</head>
<body data-scene-id="{{SCENE_ID}}">
  <div class="stage">
    <div class="layer far" data-depth="0.15"></div>
    <div class="layer mid" data-depth="0.6"></div>
    <div class="layer near" data-depth="1"></div>
    <div class="ridge"></div>
    <div class="subject">{{TITLE}}</div>
  </div>
  <div class="letterbox"></div>
  <div class="grain" style="opacity:{{GRAIN}}"></div>
  <div class="vignette" style="opacity:{{VIGNETTE}};background:radial-gradient(ellipse at center, transparent 48%, #000 140%)"></div>
  <script src="../motion/motion-lib.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      MV.enter('.subject', { easing: '{{EASING}}', duration: {{DURATION}}, from: { opacity: 0, y: 30 } });
      /* 景深推进：三层按 data-depth 各自前移，前后景速度差即纵深 */
      MV.depth('.layer', { strength: 1.4 });
      MV.idle('.subject', { delay: 2000 });
      MV.camera('.stage', { move: 'push-in', zoom: '{{ZOOM}}' });
    });
  </script>
</body>
</html>

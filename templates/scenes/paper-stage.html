<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{SCENE_ID}} · paper-stage</title>
<!--
  动效语法：y2 拼贴 + y3 白板（花叔）；错峰 + 连续形变 + 卡片流转（阿杜）
  铁律：
    - 桌面不是把素材缩小摆着：镜头停在一件上时它要占画面八九成（y2 卡）；
    - 主卡抬升、邻卡压后、被选中的接管（阿杜错峰主次）；
    - 高亮是「画上去」的，不是淡入（y2 红线）；
    - 重音预算：1 次 MV.punch（V-MOT-013）。
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* 子合成根到 .stage 之间还有一层 [data-scene-id] 包装（wrapComposition 提供），
     必须给它尺寸，否则绝对定位子元素落进 0 高度盒子。 */
  [data-scene-id] { position: relative; width: 100%; height: 100%; }
  body { font-family: {{FONT}}; background: {{NEUTRAL_4}}; color: {{NEUTRAL_0}}; }

  .stage {
    position: relative; width: 100%; height: 100%; box-sizing: border-box;
    padding: 7% 8%;
    background:
      repeating-linear-gradient(0deg, {{NEUTRAL_3}}55 0 1px, transparent 1px 3.4vmin),
      linear-gradient(174deg, {{NEUTRAL_4}} 0%, {{NEUTRAL_3}} 100%);
    perspective: 1400px; transform-style: preserve-3d;
  }

  /* 桌面光斑：环境层呼吸，给纸面一点体积 */
  .desk-glow {
    position: absolute; inset: -10%;
    background: radial-gradient(ellipse at 32% 22%, {{ACCENT}}55 0%, transparent 58%);
    pointer-events: none;
  }

  /* 卡片阵列：三张，主卡由 MV.cards(hero) 抬升接管 */
  .deck { position: relative; z-index: 3; display: flex; gap: 3.2%; align-items: stretch; margin-top: 2.4vmin; }
  .card {
    flex: 1; position: relative; padding: 4.2% 3.4%; border-radius: 10px;
    background: {{NEUTRAL_4}};
    box-shadow:
      0 18px 40px rgba(38,30,18,0.20),
      0 2px 6px rgba(38,30,18,0.14),
      0 0 0 1px {{NEUTRAL_3}};
    transform-style: preserve-3d;
  }
  .card .tag {
    font-size: calc({{BODY_SIZE}}px * 0.82); font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: {{PRIMARY}}; margin-bottom: 1.4vmin;
  }
  .card .body { font-size: calc({{BODY_SIZE}}px * 1.12); line-height: 1.5; color: {{NEUTRAL_1}}; }
  /* 高亮条：MV.highlight 扫过（荧光笔画上去） */
  .card .mark {
    display: block; height: 0.42em; margin-top: 1.2vmin; border-radius: 2px;
    background: {{ACCENT}}; opacity: 0.55; transform-origin: 0 50%;
  }

  /* 主语：这一镜要观众记住的一句话，压在卡片阵列之上 */
  .subject {
    position: relative; z-index: 4;
    font-size: {{TITLE_SIZE}}px; font-weight: 800; line-height: 1.16;
    letter-spacing: -0.02em; color: {{NEUTRAL_0}};
    max-width: 86%; margin: 0;
  }

  /* 红线连接：从主卡指向右上角的证据点（y2 的「一键连接」） */
  .thread {
    position: absolute; z-index: 2; left: 14%; top: 26%; width: 46%; height: 2px;
    background: {{PRIMARY}}; transform-origin: 0 50%; opacity: 0.8;
  }

  .kicker {
    position: relative; z-index: 4; font-size: {{BODY_SIZE}}px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase; color: {{NEUTRAL_2}};
    margin-bottom: 1.8vmin;
  }
  .hint {
    position: relative; z-index: 4; margin-top: 2.8vmin;
    font-size: {{BODY_SIZE}}px; line-height: 1.6; color: {{NEUTRAL_2}}; opacity: 0.7;
    max-width: 72%;
  }

  .letterbox { position: absolute; inset: 0; pointer-events: none; display: {{LETTERBOX}};
    background: linear-gradient(to bottom, #000 0 8%, transparent 8% 92%, #000 92% 100%); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: {{GRAIN}};
    background-image: repeating-radial-gradient(circle at 70% 60%, rgba(80,64,40,0.10) 0 0.4px, transparent 0.5px 1.8px);
    background-size: 5px 5px; mix-blend-mode: multiply; }
  .vignette { position: absolute; inset: 0; pointer-events: none; opacity: {{VIGNETTE}};
    background: radial-gradient(ellipse at center, transparent 56%, rgba(58,44,24,0.42) 130%); }
</style>
</head>
<body data-scene-id="{{SCENE_ID}}">
<div data-scene-id="{{SCENE_ID}}" data-beats="5" data-accent="{{ACCENT_FLAG}}">
  <div class="stage">
    <div class="desk-glow" data-motif></div>
    <div class="thread" data-thread></div>
    <div class="kicker" data-rank="tertiary">{{KICKER}}</div>
    <div class="subject" data-rank="primary">{{TITLE}}</div>
    <div class="deck">
      <div class="card" data-rank="secondary">
        <div class="tag">{{CARD1_TAG}}</div>
        <div class="body">{{CARD1_BODY}}</div>
        <span class="mark" data-mark></span>
      </div>
      <div class="card" data-rank="secondary">
        <div class="tag">{{CARD2_TAG}}</div>
        <div class="body">{{CARD2_BODY}}</div>
        <span class="mark" data-mark></span>
      </div>
      <div class="card" data-rank="tertiary">
        <div class="tag">{{CARD3_TAG}}</div>
        <div class="body">{{CARD3_BODY}}</div>
        <span class="mark" data-mark></span>
      </div>
    </div>
    <div class="hint" data-rank="tertiary">{{SUB_LINE}}</div>
  </div>
  <div class="letterbox"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>
<script src="../motion/gsap.min.js"></script>
<script src="../motion/motion-lib.js"></script>
<script>
(function () {
  function boot() {
    MV.use('scene-{{SCENE_ID}}');
    if (!MV.timeline()) return;
    var accentEl = document.querySelector('[data-accent]');
    var accent = accentEl ? accentEl.getAttribute('data-accent') === '1' : true;

    // ① 错峰入场：主语先落、卡片压后、hint 最后（data-rank 分级）
    MV.staggeredIn('.subject, .card, .kicker, .hint', { delay: 40, secondary: 180, tertiary: 320 });

    // ② 卡片流转：hero=0 抬升接管，邻卡压后（阿杜错峰主次）
    MV.cards('.card', { hero: {{HERO_CARD}}, delay: 260, neighborDelay: 90 });

    // ③ 连续形变：主卡在镜中变形接管（旧态退 → 变尺寸 → 新态进，三步串行）
    MV.morphTo('.card:nth-child({{HERO_CARD_N}})', {
      delay: {{MORPH_AT}},
      to: { scale: 1.05, rotationY: -4 },
    });

    // ④ 高亮「画上去」：三条荧光笔，按读字顺序错峰 60ms
    MV.highlight('.card .mark', { delay: 520 });

    // ⑤ 红线连接（擦除揭示，笔尖从左画到右）
    MV.maskReveal('.thread', { dir: 'left', duration: 500, delay: 760 });

    // 重音标点：推内容层（.deck + .subject），不推 .stage——
    // 推整屏容器等于整片永久放大 14%，观众读到的是「画面放大了」而不是「这句被强调」。
    if (accent) MV.punch('.deck', { delay: {{PUNCH_AT}}, amp: 1.14 });

    // ⑦ 环境层呼吸（与主体分离）。
    //    desk-glow 是径向光晕，大面积可用；但 shimmer 不吃 amp，
    //    写 amp: 0.28 等于没调，且光晕本身的 {{ACCENT}}26 只有 15% 不透明度，
    //    动起来亮度变化极小。改用 breathe（同时动 scale 与 opacity）并提高存在感。
    MV.motifLoop('.desk-glow', { kind: 'breathe', amp: 1.0, duration: 1800, span: 16 });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{SCENE_ID}} · process-track</title>
<!--
  动效语法：y3 白板的「过程」分支 + 阿杜错峰（P8-T1）
  对比旧 flow.html 的差异：流程不是「几排框淡入」，是一条轨道上的旅程：
    - 轨道先铺开（描线），游标是主角，沿轨道走到哪讲到哪；
    - 走过的站点点亮（点亮是状态变化，不是出现）；
    - 当前站抬升接管（阿杜主次），后续站压后；
    - 标点镜 punch 当前站（V-MOT-013 预算）；母题：光斑呼吸 + 轨道 shimmer。
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  [data-scene-id] { position: relative; width: 100%; height: 100%; }
  body { font-family: {{FONT}}; background: {{NEUTRAL_4}}; color: {{NEUTRAL_0}}; }

  .stage {
    position: relative; width: 100%; height: 100%; box-sizing: border-box;
    padding: 7% 8%;
    background:
      repeating-linear-gradient(90deg, {{NEUTRAL_3}}44 0 1px, transparent 1px 4.2vmin),
      linear-gradient(178deg, {{NEUTRAL_4}} 0%, {{NEUTRAL_3}} 100%);
  }

  .halo {
    position: absolute; inset: -10%;
    background: radial-gradient(ellipse at 30% 70%, {{ACCENT}}42 0%, transparent 58%);
    pointer-events: none;
  }

  .kicker {
    position: relative; z-index: 4; font-size: {{BODY_SIZE}}px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase; color: {{NEUTRAL_2}};
    margin-bottom: 1.6vmin;
  }
  .subject {
    position: relative; z-index: 4;
    font-size: {{TITLE_SIZE}}px; font-weight: 800; line-height: 1.16;
    letter-spacing: -0.02em; color: {{NEUTRAL_0}}; max-width: 88%; margin: 0 0 4vmin;
  }

  /* 轨道：一条横线 + 四个站点，游标在线上推进 */
  .track {
    position: relative; z-index: 3; margin-top: 5vmin; height: 22vmin;
  }
  .rail {
    position: absolute; left: 2%; right: 2%; top: 50%; height: 3px;
    background: {{NEUTRAL_3}}; border-radius: 2px; transform-origin: 0 50%;
  }
  .rail-drawn {
    position: absolute; left: 2%; right: 2%; top: 50%; height: 3px;
    background: {{PRIMARY}}; border-radius: 2px; transform: scaleX(0); transform-origin: 0 50%;
  }
  .cursor {
    position: absolute; left: 2%; top: 50%; width: 2.6vmin; height: 2.6vmin;
    margin: -1.3vmin 0 0 -1.3vmin; border-radius: 50%;
    background: {{ACCENT}}; box-shadow: 0 0 0 6px {{ACCENT}}33;
    z-index: 4;
  }
  .stop {
    position: absolute; top: 50%; width: 17%; margin: -8.4vmin 0 0 -8.5%;
    text-align: center;
  }
  .stop .dot {
    display: block; width: 2.2vmin; height: 2.2vmin; margin: 0 auto 1.2vmin;
    border-radius: 50%; background: {{NEUTRAL_4}}; border: 2px solid {{NEUTRAL_2}};
  }
  .stop .lbl {
    font-size: calc({{BODY_SIZE}}px * 0.94); font-weight: 700; line-height: 1.3;
    color: {{NEUTRAL_1}};
  }
  .stop .idx {
    font-size: calc({{BODY_SIZE}}px * 0.74); font-weight: 600; letter-spacing: 0.14em;
    color: {{NEUTRAL_2}}; display: block; margin-bottom: 0.6vmin;
  }
  .stop.lit .dot { background: {{PRIMARY}}; border-color: {{PRIMARY}}; box-shadow: 0 0 0 5px {{PRIMARY}}2e; }
  .stop.lit .lbl { color: {{NEUTRAL_0}}; }
  .stop.cur { transform: translateY(-1.2vmin) scale(1.06); }
  .stop.cur .lbl { color: {{PRIMARY}}; }

  .hint {
    position: relative; z-index: 4; margin-top: 4.6vmin;
    font-size: {{BODY_SIZE}}px; line-height: 1.6; color: {{NEUTRAL_2}}; opacity: 0.7;
    max-width: 72%;
  }

  .letterbox { position: absolute; inset: 0; pointer-events: none; display: {{LETTERBOX}};
    background: linear-gradient(to bottom, #000 0 8%, transparent 8% 92%, #000 92% 100%); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: {{GRAIN}};
    background-image: repeating-radial-gradient(circle at 40% 60%, rgba(80,64,40,0.10) 0 0.4px, transparent 0.5px 1.8px);
    background-size: 5px 5px; mix-blend-mode: multiply; }
  .vignette { position: absolute; inset: 0; pointer-events: none; opacity: {{VIGNETTE}};
    background: radial-gradient(ellipse at center, transparent 56%, rgba(58,44,24,0.40) 130%); }
</style>
</head>
<body data-scene-id="{{SCENE_ID}}">
<div data-scene-id="{{SCENE_ID}}" data-beats="6" data-accent="{{ACCENT_FLAG}}">
  <div class="stage">
    <div class="halo" data-motif></div>
    <div class="kicker" data-rank="tertiary">{{KICKER}}</div>
    <div class="subject" data-rank="primary">{{TITLE}}</div>
    <div class="track">
      <div class="rail" data-rail-base></div>
      <div class="rail-drawn" data-rail></div>
      <div class="stop lit" data-rank="secondary" style="left: 10.5%"><span class="idx">01</span><span class="dot"></span><span class="lbl">{{STOP1}}</span></div>
      <div class="stop lit" data-rank="secondary" style="left: 36.8%"><span class="idx">02</span><span class="dot"></span><span class="lbl">{{STOP2}}</span></div>
      <div class="stop cur" data-rank="secondary" style="left: 63.2%"><span class="idx">03</span><span class="dot"></span><span class="lbl">{{STOP3}}</span></div>
      <div class="stop" data-rank="tertiary" style="left: 89.5%"><span class="idx">04</span><span class="dot"></span><span class="lbl">{{STOP4}}</span></div>
      <div class="cursor" data-cursor></div>
    </div>
    <div class="hint" data-rank="tertiary">{{SUB_LINE}}</div>
  </div>
  <div class="letterbox"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>
<script src="../motion/gsap.min.js"></script>
<script src="../motion/motion-lib.js"></script>
<script>
(function () {
  function boot() {
    MV.use('scene-{{SCENE_ID}}');
    if (!MV.timeline()) return;
    var accentEl = document.querySelector('[data-accent]');
    var accent = accentEl ? accentEl.getAttribute('data-accent') === '1' : true;

    MV.motifLoop('.halo', { kind: 'breathe', amp: 0.9, duration: 1900, span: 16 });

    // ① 错峰入场：主语先落，站点依次（行程顺序 = 时间顺序，不是装饰 stagger）
    MV.staggeredIn('.subject, .kicker, .stop, .hint', { delay: 40, secondary: 150, tertiary: 300 });

    // ② 轨道从左铺开（描线：路是「修」出来的）
    MV.maskReveal('.rail-drawn', { dir: 'left', duration: 600, delay: 320 });

    // ③ 游标推进 + 站点点亮：这是本镜的主动作——
    //    游标沿轨道右移（drift 的 xPercent 通道：-265 → +265，即 2% → 55% 处的当前站），到站停住；
    //    duration 单位是秒（drift 内部 /1000），2000ms 档取 2.0（V-MOT-008 时长档位）
    MV.drift('.cursor', { xPercent: 265, duration: 2, delay: 640, rate: 0 });
    MV.counter('.stop .idx', { delay: 760, stagger: 120 });

    // ④ 当前站接管（阿杜主次）：cur 站抬升，终点站压后
    MV.performance('.stop.cur', { stiffness: {{SPRING_STIFFNESS}}, damping: {{SPRING_DAMPING}} });

    // ⑤ 重音标点：punch 当前站（不是整条轨道），仅标点镜
    if (accent) MV.punch('.stop.cur', { delay: {{PUNCH_AT}}, amp: 1.1 });

    // ⑥ 母题：光斑呼吸已立；轨道加 shimmer 微光（已走完的部分在反光）；时长取 2000ms 档
    MV.motifLoop('.rail-drawn', { kind: 'shimmer', amp: 0.5, duration: 2000, span: 16 });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
